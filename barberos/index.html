<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ilegales Barbershop · App barberos</title>
  <meta name="theme-color" content="#0B0B0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ilegales">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <header class="cabecera">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><polygon points="17,2 30,9.5 30,24.5 17,32 4,24.5 4,9.5" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        <span>Ilegales <b>Barbershop</b></span>
      </div>
      <button type="button" id="btn-salir" class="icono" aria-label="Cerrar sesión" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <!-- Inicio de sesión -->
    <main id="vista-login" class="contenido" hidden>
      <form id="form-login" class="pila" novalidate>
        <h1>Ingreso barberos</h1>
        <p class="suave">Entra con el correo y la contraseña que te dio la barbería.</p>
        <div class="campo">
          <label for="correo">Correo</label>
          <input id="correo" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input id="clave" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </main>

    <!-- Reservas (pantalla principal) -->
    <main id="vista-reservas" class="contenido" hidden>
      <div id="aviso" class="aviso" role="status" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="aviso-texto"><strong>Nueva reserva</strong><span id="aviso-detalle"></span></div>
        <button type="button" id="cerrar-aviso" class="icono icono-plano" aria-label="Cerrar aviso">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="titulo-fila">
        <div>
          <p class="suave" id="saludo"></p>
          <h1>Mis reservas</h1>
        </div>
        <span class="suave" id="pendientes"></span>
      </div>
      <div class="dias" role="group" aria-label="Día">
        <button type="button" class="dia" data-dia="0" aria-pressed="true">Hoy</button>
        <button type="button" class="dia" data-dia="1" aria-pressed="false">Mañana</button>
      </div>
      <button type="button" id="btn-notif" class="btn btn-borde" hidden>Activar notificaciones</button>
      <div id="lista-reservas" class="pila-12"></div>
    </main>

    <!-- Mi estado -->
    <main id="vista-estado" class="contenido" hidden>
      <div>
        <p class="suave">Hola,</p>
        <h1 id="nombre-barbero"></h1>
      </div>
      <h2 class="etiqueta-seccion">Mi estado</h2>
      <div id="opciones-estado" class="pila-12"></div>
      <p class="tenue centrado">Tu estado se actualiza al instante en la página web.</p>
    </main>

    <nav id="pestanas" class="pestanas" aria-label="Secciones de la app" hidden>
      <button type="button" data-vista="reservas" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Reservas</span>
      </button>
      <button type="button" data-vista="estado">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3"/></svg>
        <span>Mi estado</span>
      </button>
    </nav>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
